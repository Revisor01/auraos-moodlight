version: '3.8'

services:
  # ===== News Sentiment Analyzer (Main App) =====
  news-analyzer:
    build: .
    container_name: moodlight-analyzer
    ports:
      - "6237:6237"
    environment:
      - FLASK_ENV=production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATABASE_URL=postgresql://moodlight:${POSTGRES_PASSWORD}@postgres:5432/moodlight
      - REDIS_URL=redis://redis:6379/0
      - DEFAULT_HEADLINES_PER_SOURCE=1
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      # Firmware-Spiegel: Token, mit dem sich die CI beim Sync ausweist
      - FIRMWARE_SYNC_TOKEN=${FIRMWARE_SYNC_TOKEN}
      - FIRMWARE_MIRROR_DIR=/data/firmware
    volumes:
      # Gespiegelte Firmware-Binaries — muss einen Container-Neustart ueberleben,
      # sonst kaeme kein Geraet mehr an ein Update
      - /opt/stacks/auraos-moodlight/data/firmware:/data/firmware
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - moodlight-net
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6237/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ===== PostgreSQL Database =====
  postgres:
    image: postgres:16-alpine
    container_name: moodlight-postgres
    environment:
      POSTGRES_DB: moodlight
      POSTGRES_USER: moodlight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /opt/stacks/auraos-moodlight/data/postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Ports nur intern im Docker-Netzwerk
    expose:
      - "5432"
    networks:
      - moodlight-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodlight"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Redis Cache =====
  redis:
    image: redis:7-alpine
    container_name: moodlight-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - /opt/stacks/auraos-moodlight/data/redis:/data
    # Ports nur intern im Docker-Netzwerk
    expose:
      - "6379"
    networks:
      - moodlight-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  moodlight-net:
    driver: bridge
