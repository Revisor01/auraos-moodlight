name: Report a bug
description: Something does not work as expected.
labels: ["fehler"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not include credentials, server
        addresses or account names; this issue is public. Report security
        issues as described in SECURITY.md.
  - type: textarea
    id: beobachtung
    attributes:
      label: What happened
      description: What did you observe?
    validations:
      required: true
  - type: textarea
    id: erwartung
    attributes:
      label: What you expected
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Firmware version
      description: Shown in the lamp's web interface under “Update”.
      placeholder: "e.g. 9.24"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Sentiment API (if self-hosted)
      placeholder: "e.g. own server, state of 2026-10-01"
  - type: input
    id: geraet
    attributes:
      label: Hardware
      placeholder: "e.g. ESP32 DevKit, LED ring with 12 LEDs, Home Assistant 2026.10"
