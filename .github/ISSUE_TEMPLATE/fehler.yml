name: Fehler melden
description: Etwas funktioniert nicht wie erwartet.
labels: ["fehler"]
body:
  - type: markdown
    attributes:
      value: |
        Danke für die Meldung. Bitte keine Zugangsdaten, Server-Adressen oder
        Kontonamen eintragen; dieses Issue ist öffentlich. Sicherheitslücken
        bitte über den Weg in SECURITY.md melden.
  - type: textarea
    id: beobachtung
    attributes:
      label: Beobachtung
      description: Was ist passiert?
    validations:
      required: true
  - type: textarea
    id: erwartung
    attributes:
      label: Erwartung
      description: Was hättest du stattdessen erwartet?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachvollziehen
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Firmware-Version
      description: Steht in der Weboberfläche der Lampe unter „Update“.
      placeholder: "z. B. 9.24"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Sentiment-API (falls selbst betrieben)
      placeholder: "z. B. eigener Server, Stand vom 01.10.2026"
  - type: input
    id: geraet
    attributes:
      label: Hardware
      placeholder: "z. B. ESP32-DevKit, LED-Ring mit 12 LEDs, Home Assistant 2026.10"
