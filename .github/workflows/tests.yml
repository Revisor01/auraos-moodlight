name: Tests

# Sentiment-API: unittest ohne Datenbank (psycopg2 und redis werden in den
# Tests ersetzt). Firmware: Unity-Tests der Lichtlogik auf dem Host
# (`pio test -e native`), ohne ESP32.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sentiment-api/requirements.txt

      - name: Sentiment-API installieren
        run: pip install -r sentiment-api/requirements.txt

      - name: Sentiment-API testen
        working-directory: sentiment-api
        env:
          FIRMWARE_MIRROR_DIR: ${{ runner.temp }}/firmware
        run: python -m unittest discover -s tests -v

      - name: PlatformIO installieren
        run: pip install platformio

      - name: Firmware-Logik testen
        working-directory: firmware
        run: pio test -e native
