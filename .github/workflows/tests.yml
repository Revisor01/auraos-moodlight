name: Tests

# Sentiment-API: unittest ohne Datenbank (psycopg2 und redis werden in den
# Tests ersetzt). Firmware: Unity-Tests der Lichtlogik auf dem Host
# (`pio test -e native`), ohne ESP32.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sentiment-api/requirements.txt

      - name: Sentiment-API installieren
        run: pip install -r sentiment-api/requirements.txt

      - name: Sentiment-API testen
        working-directory: sentiment-api
        env:
          FIRMWARE_MIRROR_DIR: ${{ runner.temp }}/firmware
        run: python -m unittest discover -s tests -v

      - name: PlatformIO installieren
        run: pip install platformio

      - name: Firmware-Logik testen
        working-directory: firmware
        run: pio test -e native
