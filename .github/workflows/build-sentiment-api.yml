name: Build Sentiment API

on:
  push:
    branches: [main]
    paths:
      - 'sentiment-api/**'
      - '.github/workflows/build-sentiment-api.yml'
  pull_request:
    paths:
      - 'sentiment-api/**'
      - '.github/workflows/build-sentiment-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    uses: Revisor01/workflows/.github/workflows/docker-image.yml@5bb9fc1d9e2cd728029f334f50bbe355f005eef5 # 1.3.1
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/${{ github.repository }}/sentiment-api
      kontext: ./sentiment-api

  deploy:
    needs: image
    if: github.event_name != 'pull_request'
    uses: Revisor01/workflows/.github/workflows/portainer-deploy.yml@5bb9fc1d9e2cd728029f334f50bbe355f005eef5 # 1.3.1
    with:
      pruef-url: https://analyse.godsapp.de/api/health
    secrets:
      webhook: ${{ secrets.PORTAINER_WEBHOOK_URL }}
