name: Release Firmware

# Baut Firmware-BIN und UI-TGZ für einen Versions-Tag; die Version kommt aus config.h, nicht aus dem Tag.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Bestehender Tag, fuer den gebaut werden soll (z.B. v9.15)'
        required: true

permissions: {}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Version aus config.h lesen und gegen den Tag pruefen
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep '^#define MOODLIGHT_VERSION' firmware/src/config.h | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            echo "FEHLER: MOODLIGHT_VERSION nicht in firmware/src/config.h gefunden"
            exit 1
          fi
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "FEHLER: Tag $TAG passt nicht zu MOODLIGHT_VERSION $VERSION in config.h."
            echo "Der Tag muss der Firmware-Version entsprechen (Tag v9.15 => config.h 9.15)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Baue Version $VERSION (Tag $TAG)"

      - name: Firmware kompilieren
        working-directory: firmware
        run: pio run

      - name: Release-Dateien erstellen
        id: artifacts
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          OUT="release-artifacts"
          mkdir -p "$OUT"

          BIN="firmware/.pio/build/esp32dev/firmware.bin"
          if [ ! -f "$BIN" ]; then
            echo "FEHLER: $BIN nicht gefunden nach dem Build"
            exit 1
          fi
          cp "$BIN" "$OUT/Firmware-${VERSION}-AuraOS.bin"

          # UI-TGZ — gleiche Dateiliste wie build-release.sh
          (cd firmware/data && tar -czf "../../$OUT/UI-${VERSION}-AuraOS.tgz" \
              --exclude="*.tmp.*" --exclude="*.tgz" --exclude="*.tar" --exclude=".DS_Store" \
              index.html setup.html mood.html js/ css/)

          # Verifizieren: die beiden Kernseiten muessen im Archiv liegen
          CONTENTS=$(tar -tzf "$OUT/UI-${VERSION}-AuraOS.tgz")
          for f in index.html setup.html mood.html; do
            echo "$CONTENTS" | grep -q "$f" || { echo "FEHLER: $f fehlt im UI-TGZ"; exit 1; }
          done

          # Firmware-Binary plausibilisieren: ESP32-Images beginnen mit 0xE9
          MAGIC=$(head -c 1 "$OUT/Firmware-${VERSION}-AuraOS.bin" | xxd -p)
          if [ "$MAGIC" != "e9" ]; then
            echo "FEHLER: Firmware-Binary hat kein ESP32-Magic-Byte (0xE9), gefunden: 0x$MAGIC"
            exit 1
          fi

          ls -lh "$OUT"

      - name: Release-Notes aus dem CHANGELOG schneiden
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_FILE="release-notes.md"
          awk -v v="$VERSION" '
            $0 ~ "^## \\["v"\\]" {p=1; next}
            /^## \[/ {if (p) exit}
            p
          ' CHANGELOG.md > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "Kein CHANGELOG-Abschnitt fuer $VERSION gefunden — Release wird ohne Notes erstellt."
            echo "Siehe CHANGELOG.md" > "$NOTES_FILE"
          fi
          cat "$NOTES_FILE"

      - name: GitHub-Release anlegen oder aktualisieren
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: AuraOS v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            release-artifacts/Firmware-${{ steps.version.outputs.version }}-AuraOS.bin
            release-artifacts/UI-${{ steps.version.outputs.version }}-AuraOS.tgz

      # Geräte erreichen GitHub nicht und laden vom Spiegel; ausgeliefert wird erst nach Freigabe im Admin.
      - name: Firmware-Spiegel benachrichtigen
        if: success()
        continue-on-error: true   # Ein fehlender Spiegel darf das Release nicht kippen
        env:
          SYNC_URL: ${{ secrets.FIRMWARE_SYNC_URL }}
          SYNC_TOKEN: ${{ secrets.FIRMWARE_SYNC_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -uo pipefail
          if [ -z "${SYNC_URL:-}" ] || [ -z "${SYNC_TOKEN:-}" ]; then
            echo "FIRMWARE_SYNC_URL/-TOKEN nicht gesetzt — Spiegel wird uebersprungen."
            echo "Das Release ist trotzdem fertig; die Geraete sehen es nur nicht automatisch."
            exit 0
          fi

          # Kurz warten: die Assets brauchen einen Moment, bis GitHub sie ausliefert
          sleep 15

          HTTP_CODE=$(curl -sS -o sync-response.json -w '%{http_code}' \
            --max-time 120 --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST "$SYNC_URL" \
            -H "X-Sync-Token: $SYNC_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"version\":\"$VERSION\"}") || true

          echo "Spiegel antwortete mit HTTP ${HTTP_CODE:-(keine Antwort)}"
          cat sync-response.json 2>/dev/null || true
          echo

          if [ "${HTTP_CODE:-000}" = "200" ]; then
            echo "Version $VERSION ist gespiegelt. Freigabe im Admin nicht vergessen."
          else
            echo "Spiegelung fehlgeschlagen — Version $VERSION laesst sich im Admin manuell nachziehen."
          fi
